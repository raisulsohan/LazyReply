<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazyReply Poster</title>
<!-- The 4:5 Facebook poster. The box in the middle is the real app: shoot.ps1 draws it and puts it in the "assets" script below.
     Change the text on the right, then press "Download JPG". -->
<style>
  :root { --bg: #f3f2ef; --panel: #fff; --text: #1f1d1a; --muted: #6f6a62; --line: #e4e1db; --accent: #5b6cf0; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a19; --panel: #242322; --text: #edeae5; --muted: #9a958d; --line: #383532; --accent: #8b97ff; --on-accent: #11131f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Noto Sans Bengali", "Noto Sans", "Segoe UI", sans-serif; }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 16px; max-width: 1200px; margin: 0 auto; }
  #poster { width: min(100%, 560px); height: auto; aspect-ratio: 4 / 5; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  form { flex: 1 1 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; align-content: start; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, textarea { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 64px; }
  button { font: inherit; font-weight: 700; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  .note { font-size: 12px; color: var(--muted); margin: 0; }
  body.export { background: #000; }
  body.export main { padding: 0; display: block; max-width: none; }
  body.export form { display: none; }
  body.export #poster { width: 1080px; border-radius: 0; box-shadow: none; display: block; }
</style>
</head>
<body>
<main>
  <canvas id="poster" width="2160" height="2700"></canvas>
  <form id="f" onsubmit="return false">
    <label>শিরোনাম, প্রথম লাইন <input name="h1" value="বাংলায় লিখুন,"></label>
    <label>শিরোনাম, দ্বিতীয় লাইন (*তারা* দেওয়া শব্দ হলুদ) <input name="h2" value="*ইংরেজি* পাঠান।"></label>
    <label>নিচের লাইন <textarea name="sub">চ্যাটের বক্সেই বাংলা বা Banglish লিখুন। দাঁড়ি দিলেই বক্সের উপরে তিন রকম গুছানো ইংরেজি।</textarea></label>
    <label>চ্যাট বক্সের লেখা <input name="chat" value="কাজটা কাল সন্ধ্যার মধ্যে দিয়ে দিব। লোগোটা পাঠান।"></label>
    <p class="note">উপরের তিনটা ইংরেজি এখানে নিজে লিখুন। পাতাটা নিজে অনুবাদ করে না। আসল ইংরেজি পেতে LazyReply-তে বাংলাটা লিখে তিনটা লাইন এখানে কপি করুন।</p>
    <label>1 · Professional <textarea name="en1">I will deliver the work by tomorrow evening. Could you please send me the logo file?</textarea></label>
    <label>2 · Friendly <textarea name="en2">Sure thing! I'll have it ready by tomorrow evening. Just send over the logo file when you can.</textarea></label>
    <label>3 · Short <textarea name="en3">Will deliver by tomorrow evening. Please send the logo file.</textarea></label>
    <label>ছোট ট্যাগ (কমা দিয়ে আলাদা) <input name="chips" value="অভ্রের সাথে চলে, Alt+1 চাপলেই বসে যায়, নিজে কিছু পাঠায় না"></label>
    <label>উপরের ডান কোণ <input name="credit" value="Windows-এর জন্য · by Raisul Sohan"></label>
    <p class="note" id="fit" hidden style="color:#d64545">লেখা পোস্টারে ধরছে না: নিচের ট্যাগ কেটে যাচ্ছে। ইংরেজি বা নিচের লাইন ছোট করুন।</p>
    <button type="button" id="dl">Download JPG</button>
    <p class="note">ছবিটা 2160 × 2700 (4:5)। Facebook আর Instagram feed, দুটোতেই চলে।</p>
  </form>
</main>

<script>
(function () {
  var W = 1080, H = 1350, K = 2;
  // All text, the app's box too: Noto Sans Bengali, with Noto Sans for Latin letters.
  var FONT = '"Noto Sans Bengali", "Noto Sans", "Segoe UI", sans-serif';
  var YELLOW = '#ffd45c';
  var cv = document.getElementById('poster'), ctx = cv.getContext('2d');
  var form = document.getElementById('f');
  if (/[?&]export\b/.test(location.search)) document.body.className = 'export';
  var compare = /[?&]compare\b/.test(location.search);   // the app's own picture under the drawn box, for checking

  var imgs = {}, waiting = 0;
  if (!window.ASSETS) {
    form.insertAdjacentHTML('afterbegin', '<p class="note" style="color:#d64545">অ্যাপের ছবি নেই। social\\shoot.ps1 চালান।</p>');
    return;
  }
  ['box', 'mark'].forEach(function (k) {
    var im = new Image();
    waiting++;
    im.onload = function () { if (--waiting === 0) draw(); };
    im.src = window.ASSETS[k];
    imgs[k] = im;
  });

  function val(n) { return form.elements[n].value; }

  function round(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrap(text, maxW) {
    var words = text.split(/\s+/), lines = [], line = '';
    words.forEach(function (w) {
      var t = line ? line + ' ' + w : w;
      if (line && ctx.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
    });
    if (line) lines.push(line);
    return lines;
  }

  // One line where *starred* words are yellow.
  function marked(text, x, y) {
    text.split(/(\*[^*]+\*)/).forEach(function (part) {
      if (!part) return;
      var hot = part.charAt(0) === '*';
      var t = hot ? part.slice(1, -1) : part;
      ctx.fillStyle = hot ? YELLOW : '#fff';
      ctx.fillText(t, x, y);
      x += ctx.measureText(t).width;
    });
  }

  function glow(x, y, r, color) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- the inline box ----------
  // The same layout as InlinePopup.Relayout / OnPaint in the app, in its 100 % pixels, with the
  // app's colours and line heights. The text is Noto (ascent 1.069 em, line 1.362 em), centred in
  // each line as the app centres its own font.
  var BOX = {
    w: 520, pad: 14, headerH: 24, inner: 12, badge: 24,
    bg: '#ffffff', card: '#f6f4f0', text: '#1f1d1a', muted: '#8a857d', border: '#ece9e4', green: '#2ba36b',
    kinds: ['Professional', 'Friendly', 'Short']
  };
  var BF = {
    small: { px: 11.333, w: 400, h: 15 },
    body:  { px: 14,     w: 400, h: 19 },
    badge: { px: 10.667, w: 700, h: 13 },
    close: { px: 16,     w: 400, h: 21 },
    name:  { px: 12,     w: 700, h: 15 }
  };
  Object.keys(BF).forEach(function (k) { var f = BF[k]; f.asc = (f.h - 1.362 * f.px) / 2 + 1.069 * f.px; });
  function bfont(f) { ctx.font = BF[f].w + ' ' + BF[f].px + 'px ' + FONT; }
  function lpad(f) { return BF[f].h / 6; }   // the side padding TextRenderer adds
  function textW() { return BOX.w - 2 * BOX.pad - 2 * BOX.inner - BOX.badge - 10; }
  function bodyLines(t) { bfont('body'); return wrap(t.length ? t : '…', textW() - 2 * lpad('body')); }
  function rowTops(rows) {
    var y = BOX.pad + BOX.headerH + 10, tops = [];
    rows.forEach(function (t) {
      var h = BOX.inner + BF.small.h + 2 + bodyLines(t).length * BF.body.h + BOX.inner;
      tops.push([y, h]);
      y += h + 6;
    });
    return tops;
  }
  function boxHeight(rows) { var t = rowTops(rows), last = t[t.length - 1]; return last[0] + last[1] + BOX.pad; }
  // Text whose cell top is at y, as TextRenderer draws it.
  function cell(f, t, x, y, color) { bfont(f); ctx.fillStyle = color; ctx.fillText(t, x, y + BF[f].asc); }

  function drawBox(rows) {
    var B = BOX, pad = B.pad, cy = pad + B.headerH / 2, h = boxHeight(rows);
    ctx.textAlign = 'left';
    ctx.fillStyle = B.bg; ctx.fillRect(0, 0, B.w, h);
    ctx.strokeStyle = B.border; ctx.lineWidth = 1 / 1.5; ctx.strokeRect(0.3, 0.3, B.w - 0.6, h - 0.6);

    // Header: the live dot, the name, the pill, the keys and the close button.
    ctx.beginPath(); ctx.arc(pad + 4, cy, 4, 0, Math.PI * 2); ctx.fillStyle = B.green; ctx.fill();
    cell('name', 'LazyReply', pad + 14 + lpad('name'), cy - 7, B.text);
    bfont('name');
    var nameW = ctx.measureText('LazyReply').width + 2 * lpad('name');
    bfont('small');
    var pillText = 'বাংলা → English', pw = ctx.measureText(pillText).width + 2 * lpad('small') + 16;
    var px = pad + 14 + nameW + 8, py = pad + 2;
    round(px, py, pw, 19, 9.5); ctx.fillStyle = B.card; ctx.fill();
    ctx.textAlign = 'center'; cell('small', pillText, px + pw / 2, py + 2, B.muted); ctx.textAlign = 'left';
    var closeX = B.w - pad - 26 + 4;
    var hint = 'Ctrl ধরে ↑↓ · Ctrl+Enter পাঠাও';
    var hw = ctx.measureText(hint).width + 2 * lpad('small');
    if (closeX - 8 - hw > px + pw + 10) cell('small', hint, closeX - 8 - hw + lpad('small'), cy - 7, B.muted);
    ctx.textAlign = 'center'; cell('close', '×', closeX + 13, pad - 2 + 2, B.muted); ctx.textAlign = 'left';

    // The three versions.
    var tx = pad + B.inner + B.badge + 10;
    rowTops(rows).forEach(function (r, i) {
      var top = r[0];
      round(pad + 12.5, top + 12.5, 23, 23, 8); ctx.fillStyle = B.card; ctx.fill();
      ctx.strokeStyle = B.border; ctx.lineWidth = 1; ctx.stroke();
      ctx.textAlign = 'center'; cell('badge', String(i + 1), pad + 24, top + 12 + 5, B.muted); ctx.textAlign = 'left';
      cell('small', B.kinds[i] + '  ·  Alt+' + (i + 1), tx + lpad('small'), top + 12, B.muted);
      bodyLines(rows[i]).forEach(function (l, j) {
        cell('body', l, tx + lpad('body'), top + B.inner + BF.small.h + 2 + j * BF.body.h, rows[i].length ? B.text : B.muted);
      });
    });
  }

  function draw() {
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.textBaseline = 'alphabetic';

    // Background: deep indigo with an accent glow and a little Avro green.
    var bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#4553e6');
    bg.addColorStop(0.55, '#2c2f9e');
    bg.addColorStop(1, '#161848');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    glow(930, 120, 620, 'rgba(150,162,255,.55)');
    glow(80, 1300, 560, 'rgba(43,190,120,.32)');
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    for (var gy = 30; gy < H; gy += 36) for (var gx = 30; gx < W; gx += 36) ctx.fillRect(gx, gy, 2, 2);

    // Header: the app mark and name.
    var M = 64;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.drawImage(imgs.mark, M, 58, 60, 60);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    round(M + 0.5, 58.5, 59, 59, 12); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '700 38px ' + FONT;
    ctx.fillText('LazyReply', M + 78, 101);

    // Headline.
    ctx.font = '400 24px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.textAlign = 'right';
    ctx.fillText(val('credit'), W - M, 98);
    ctx.textAlign = 'left';

    ctx.font = '700 116px ' + FONT;
    marked(val('h1'), M - 4, 252);
    marked(val('h2'), M - 4, 404);   // room for the "ু" of the first line above the second

    // Sub line.
    ctx.font = '400 32px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    var sy = 466;
    wrap(val('sub'), W - 2 * M).slice(0, 3).forEach(function (l) { ctx.fillText(l, M, sy); sy += 48; });

    // The inline box, floating just above the chat box, as in use.
    var bw = W - 2 * M, bs = bw / BOX.w;
    var bx = M, by = sy + 6;
    var rowsEn = ['en1', 'en2', 'en3'].map(val);
    var bh = boxHeight(rowsEn) * bs;
    ctx.save();
    ctx.shadowColor = 'rgba(8,10,40,.55)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 28;
    round(bx, by, bw, bh, 20); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
    ctx.save();
    round(bx, by, bw, bh, 20); ctx.clip();
    if (compare) ctx.drawImage(imgs.box, bx, by, bw, imgs.box.height * bw / imgs.box.width);
    ctx.translate(bx, by); ctx.scale(bs, bs);
    if (compare) ctx.globalAlpha = 0.5;
    drawBox(rowsEn);
    ctx.restore();

    // The chat box the user types in.
    var cy = by + bh + 18, ch = 92;
    ctx.save();
    ctx.shadowColor = 'rgba(8,10,40,.45)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
    round(bx, cy, bw, ch, 46); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = '#5b6cf0';
    round(bx + 1.5, cy + 1.5, bw - 3, ch - 3, 44.5); ctx.stroke();
    var sendR = 30, sendX = bx + bw - 22 - sendR, sendY = cy + ch / 2;
    ctx.font = '400 31px ' + FONT;
    var chat = val('chat'), room = bw - 36 - 2 * sendR - 50;
    while (chat.length > 1 && ctx.measureText(chat).width > room) chat = chat.slice(1);
    if (chat !== val('chat')) chat = '…' + chat.slice(1);
    ctx.fillStyle = '#1f1d1a';
    ctx.fillText(chat, bx + 36, cy + 58);
    var tx = bx + 36 + ctx.measureText(chat).width + 4;
    ctx.fillStyle = '#5b6cf0'; ctx.fillRect(tx, cy + 26, 3, 42);
    ctx.beginPath(); ctx.arc(sendX, sendY, sendR, 0, Math.PI * 2); ctx.fillStyle = '#5b6cf0'; ctx.fill();
    ctx.beginPath();   // a paper plane
    ctx.moveTo(sendX - 13, sendY - 12); ctx.lineTo(sendX + 15, sendY); ctx.lineTo(sendX - 13, sendY + 12);
    ctx.lineTo(sendX - 8, sendY); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();

    // Chips.
    var chips = val('chips').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    ctx.font = '600 27px ' + FONT;
    var x = M, y = cy + ch + 44;
    chips.forEach(function (c, i) {
      var w = ctx.measureText(c).width + 44;
      if (x + w > W - M) { x = M; y += 62; }
      round(x, y, w, 50, 25);
      ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 20, y + 25, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = i === 0 ? '#4cd394' : YELLOW; ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(c, x + 32, y + 35);
      x += w + 12;
    });

    // Too much text pushes the chips off the poster: say so next to the fields.
    document.getElementById('fit').hidden = y + 50 <= H - 24;
  }

  form.addEventListener('input', function () { if (waiting === 0) draw(); });
  document.getElementById('dl').addEventListener('click', function () {
    cv.toBlob(function (b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'lazyreply-poster-4x5.jpg';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }, 'image/jpeg', 0.93);
  });
})();
</script>
